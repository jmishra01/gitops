name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.14.0 check .
      - run: uvx ruff@0.14.0 format --check .
      # gitops/core only (see [tool.mypy]); checked as each platform, since it branches on sys.platform.
      - run: |
          for platform in linux darwin win32; do
            uvx mypy@1.18.2 --platform "$platform"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # The suite takes about two minutes; a hang (for example a modal dialog nobody can close)
    # would otherwise hold the runner for GitHub's six-hour limit.
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      # Qt needs these shared libraries even when it renders offscreen.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rfE 2>&1 | tee pytest.log
      # Job logs need a GitHub sign-in to read, but annotations are public: publish the end of
      # pytest's output (failure summary, or the stack a crash printed) as one.
      - if: failure()
        shell: bash
        run: |
          uv run python - <<'EOF'
          from pathlib import Path
          tail = Path("pytest.log").read_text(errors="replace").splitlines()[-150:]
          text = "\n".join(tail).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest output (last {len(tail)} lines)::{text}")
          EOF
