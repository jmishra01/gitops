[project]
name = "gitops"
dynamic = ["version"]
description = "Desktop git repository manager built with PySide6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.gui-scripts]
gitops = "gitops.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# gitops/__init__.py holds the one copy of the version; the app and the build read it from there.
version = { attr = "gitops.__version__" }

[tool.setuptools.packages.find]
include = ["gitops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter owns line length; the long lines left are strings and comments.
ignore = ["E501"]

[tool.uv]
# Reinstall when the version in gitops/__init__.py changes, so the installed metadata keeps up.
cache-keys = [{ file = "pyproject.toml" }, { file = "gitops/__init__.py" }]
