[project]
name = "gitops"
dynamic = ["version"]
description = "Desktop git repository manager built with PySide6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.gui-scripts]
gitops = "gitops.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# gitops/__init__.py holds the one copy of the version; the app and the build read it from there.
version = { attr = "gitops.__version__" }

[tool.setuptools.packages.find]
include = ["gitops*"]

[tool.setuptools.package-data]
gitops = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Print every thread's stack when one test runs this long, so a hang in CI shows where it is.
faulthandler_timeout = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter owns line length; the long lines left are strings and comments.
ignore = ["E501"]

[tool.uv]
# Reinstall when the version in gitops/__init__.py changes, so the installed metadata keeps up.
cache-keys = [{ file = "pyproject.toml" }, { file = "gitops/__init__.py" }]

[tool.mypy]
# The UI-free core is type-checked in CI, as each platform (see .github/workflows/ci.yml).
files = ["gitops/core"]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
